// Inputs and validation output of the model-to-kinematics asset pipeline.
syntax = "proto3";

package kinematics.v1;

import "common/v1/common.proto";

option go_package = "github.com/viamrobotics/visualization/kinematics/v1;kinematicsv1";

// Everything needed to compile mesh files into an RDK kinematic model. Stored as
// `kinematics.json` beside the mesh files it references, and the source of truth for a rebuild.
message KinematicsSpec {
  // Model name. RDK namespaces the model's frames with the component name at runtime, so this only
  // names the model in its own file.
  string name = 1;
  // Bodies of the model. Every link hangs off the model's base frame, which is the component's
  // frame origin, where it mounts.
  repeated Link links = 2;
  // The tool center point (TCP) in the assembly frame: the model's base frame with every joint at
  // zero. The robot's motion planner moves this frame.
  viam.common.v1.Pose tcp_pose = 3;
  // Joints between links. Empty for a static model.
  repeated Joint joints = 4;
  // The joint the TCP moves with. Empty fixes it to the model base.
  string tcp_parent = 5;
}

// One rigid body of the model, compiled from one mesh file.
message Link {
  // Unique within the spec. Becomes the RDK link id.
  string id = 1;
  // Mesh file path relative to the spec file. `.stl`, `.ply`, `.obj`, or `.dae`, case-insensitive. The full-detail mesh
  // is the link's visual geometry. Its collision geometry is derived from it.
  string mesh_path = 2;
  // Unit the mesh file was authored in. Required, because CAD tools default to millimetres and RDK
  // reads mesh vertices as metres. A `.dae` file's own `<unit meter>` is applied first, and this
  // scales on top of it, as a URDF mesh scale does in ROS.
  LengthUnit mesh_unit = 3;
  // Places the mesh file's own frame in the assembly frame, applied after rescaling. Unlike a URDF
  // origin, which is relative to the parent link, this is in the assembly frame. CAD exports in
  // assembly coordinates need only the unit and up-axis correction here.
  viam.common.v1.Pose origin = 4;
  // How the link's collision geometry represents the mesh.
  CollisionShape collision = 5;
  // Triangle limit for COLLISION_SHAPE_MESH. 0 keeps every mesh triangle. Values below RDK's
  // decimation floor of 12 are raised to it.
  uint32 max_triangles = 6;
  // The joint this link moves with. Empty fixes it to the model base.
  string parent = 7;
  // A collision shape given by dimensions instead of a mesh file. When set, mesh_path, mesh_unit,
  // collision, and max_triangles must be empty, and the shape is centred on `origin`.
  Primitive primitive = 8;
}

// A collision shape given by dimensions, in millimetres. Capsule and cylinder axes run along the
// Z axis of the link's origin, as URDF's cylinder does.
message Primitive {
  oneof shape {
    Box box = 1;
    Sphere sphere = 2;
    Capsule capsule = 3;
    Cylinder cylinder = 4;
  }

  // Full side lengths.
  message Box {
    double x = 1;
    double y = 2;
    double z = 3;
  }

  message Sphere {
    double radius = 1;
  }

  // Length runs end to end, including both hemispherical caps, as RDK's capsule does.
  message Capsule {
    double radius = 1;
    double length = 2;
  }

  message Cylinder {
    double radius = 1;
    double length = 2;
  }
}

// A single-axis joint. Every link and joint hangs off the model base or off one joint.
message Joint {
  // Unique among links and joints.
  string id = 1;
  JointType type = 2;
  // The joint this joint rides on, for a chain. Empty mounts it on the model base.
  string parent = 3;
  // The joint frame in the assembly frame, not relative to the parent as in URDF. The compiler
  // converts it to the parent's local frame.
  viam.common.v1.Pose origin = 4;
  // Motion axis in the joint frame.
  viam.common.v1.Vector3 axis = 5;
  // Limits in millimetres for a prismatic joint and degrees for a revolute one. Ignored for a mimic
  // joint, which takes its source's limits.
  double lower = 6;
  double upper = 7;
  // Set when this joint follows another instead of taking an input of its own.
  Mimic mimic = 8;
}

// value = multiplier * source + offset, in the source joint's units. A multiplier of 0 is read as 1,
// because proto3 cannot tell an unset multiplier from zero, and a zero multiplier freezes the joint.
message Mimic {
  string joint = 1;
  double multiplier = 2;
  double offset = 3;
}

enum JointType {
  JOINT_TYPE_UNSPECIFIED = 0;
  JOINT_TYPE_REVOLUTE = 1;
  JOINT_TYPE_PRISMATIC = 2;
}

enum LengthUnit {
  LENGTH_UNIT_UNSPECIFIED = 0;
  LENGTH_UNIT_METERS = 1;
  LENGTH_UNIT_MILLIMETERS = 2;
  LENGTH_UNIT_INCHES = 3;
}

enum CollisionShape {
  // Treated as COLLISION_SHAPE_MESH.
  COLLISION_SHAPE_UNSPECIFIED = 0;
  // The mesh, conservatively decimated to `max_triangles`.
  COLLISION_SHAPE_MESH = 1;
  // The axis-aligned bounding box of the mesh, in the mesh file's frame.
  COLLISION_SHAPE_BOX = 2;
}

// What a robot would see after loading a model through `GetKinematics`.
message ValidationReport {
  // Degrees of freedom of the model after the round trip.
  uint32 dof = 1;
  // TCP pose at zero inputs, relative to the model's base frame.
  viam.common.v1.Pose tcp_pose = 2;
  // One entry per link that carries geometry, sorted by id.
  repeated LinkReport links = 3;
  // Size of the model file in bytes.
  uint64 model_bytes = 4;
  // Every failed check, empty when the model is valid.
  repeated string failures = 5;
  // One entry per model input, in input order. Empty for a static model.
  repeated InputReport inputs = 6;
  // Problems that do not stop the model working, such as a collision mesh over the triangle limit.
  repeated string warnings = 7;
}

// One model input as RDK exposes it through CurrentInputs and GoToInputs.
message InputReport {
  // The joint the input drives.
  string joint = 1;
  JointType type = 2;
  // In RDK input units: millimetres for prismatic, radians for revolute.
  double min = 3;
  double max = 4;
}

message LinkReport {
  string id = 1;
  CollisionShape shape = 2;
  // 0 for a box.
  uint32 triangles = 3;
  // Axis-aligned extent in millimetres, in the geometry's own frame.
  viam.common.v1.Vector3 extent = 4;
  // Set for a primitive link, whose shape is unset and triangles 0.
  Primitive primitive = 5;
  // The collision mesh has more triangles than the warning limit.
  bool over_triangle_limit = 6;
  // A max_triangles value under the limit, set when over_triangle_limit is.
  uint32 suggested_max_triangles = 7;
}

// What a URDF import kept, changed, and dropped.
message ImportReport {
  // URDF elements with no place in a Viam model, such as `<inertial>`, `<transmission>`, and
  // `<gazebo>`, as "<element> in <link or joint>".
  repeated string dropped = 1;
  // Links and joints renamed on import, as "old -> new".
  repeated string renamed = 2;
  // Links whose geometry came from `<visual>` because they had no `<collision>`.
  repeated string visual_fallbacks = 3;
  // The URDF link the TCP was placed at. Empty when no link matched the naming conventions.
  string tcp_link = 4;
  // Geometry-less leaf links the user can pick as the TCP.
  repeated string tcp_candidates = 5;
  // The URDF file read, relative to the upload root.
  string urdf_path = 6;
}
