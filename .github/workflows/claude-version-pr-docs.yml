name: Version PR Docs Review

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [main]
    paths: ['**/CHANGELOG.md']
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Version PR number to review'
        required: true
        type: string

permissions:
  contents: read

jobs:
  review:
    if: >-
      github.repository_owner == 'viamrobotics' &&
      (
        github.event_name == 'workflow_dispatch' ||
        github.event.pull_request.head.ref == 'changeset-release/main'
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - name: Resolve PR
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            PR_NUMBER="${{ inputs.pr_number }}"
            DATA=$(gh pr view "$PR_NUMBER" --repo "$REPO" --json headRefName,headRefOid,baseRefName)
            HEAD_REF=$(echo "$DATA" | jq -r '.headRefName')
            HEAD_SHA=$(echo "$DATA" | jq -r '.headRefOid')
            BASE_REF=$(echo "$DATA" | jq -r '.baseRefName')
            if [ "$HEAD_REF" != "changeset-release/main" ]; then
              echo "PR #$PR_NUMBER head is '$HEAD_REF', expected 'changeset-release/main'" >&2
              exit 1
            fi
          else
            PR_NUMBER="${{ github.event.pull_request.number }}"
            HEAD_SHA="${{ github.event.pull_request.head.sha }}"
            BASE_REF="${{ github.event.pull_request.base.ref }}"
          fi
          echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
          echo "head_sha=$HEAD_SHA"   >> "$GITHUB_OUTPUT"
          echo "base_ref=$BASE_REF"   >> "$GITHUB_OUTPUT"

      - name: Checkout
        # actions/checkout@v6
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          # Commits and trees only; gh-pages' built preview sites are the bulk of the repo and are
          # never read here. Blobs are fetched on demand.
          filter: blob:none
          ref: ${{ steps.pr.outputs.head_sha }}

      - name: Review changelog and propose docs
        # anthropics/claude-code-action — pin to the SHA you use elsewhere
        uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.pr.outputs.pr_number }}
          PR_HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
          PR_BASE_REF: ${{ steps.pr.outputs.base_ref }}
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          allowed_bots: 'viam-ci-org-reader'
          claude_args: >-
            --max-turns 60
            --allowed-tools "Read,Glob,Grep,Bash(gh pr view*),Bash(gh pr diff*),Bash(gh pr comment*),Bash(gh api *),Bash(git log*),Bash(git diff*),Bash(git show*),Bash(git fetch*),Bash(ls *),Bash(find *)"
          prompt: |
            You are reviewing a changesets-generated version PR for @viamrobotics/visualization.
            Your only output is one PR comment posted via `gh pr comment $PR_NUMBER`.
            DO NOT use Edit or Write. DO NOT push commits. DO NOT modify any file.

            # Step 1 — Read the changelog diff
            git fetch origin "$PR_BASE_REF"
            git diff "origin/$PR_BASE_REF"...HEAD -- 'CHANGELOG.md' '**/CHANGELOG.md'

            # Step 2 — Investigate each changelog entry that references a PR (#NNN)
            For each referenced PR:
              gh pr view <n>           # intent / description
              gh pr diff <n>           # actual change
            Identify what API surface is affected and whether external users would touch it.
            If a PR cannot be fetched, note that in the final comment — do not guess.

            # Step 3 — Read the current use-case guides
            - docs/src/content/docs/guides/embedding.mdx
            - docs/src/content/docs/guides/local-usage.mdx
            - docs/src/content/docs/guides/worldstatestore.mdx
            - docs/src/content/docs/migration/v1-to-v2.mdx

            # Step 4 — Classify each changelog entry
            (A) UPDATE GUIDE — a documented API / prop / behavior is now wrong, removed,
                renamed, or has a new required parameter.
            (B) MIGRATION — a breaking change for an existing v2 user.
            (C) CONSIDER — a new OPTIONAL field / prop on an API already shown in a guide.
                Promote (C) → (A) only if a user following the existing example would
                naturally want this field. Otherwise stay at (D).
            (D) NO CHANGE — default. Internal refactors, dependency bumps, bug fixes,
                or new surfaces not referenced in any current guide.

            # Decision defaults
            - Default is (D). Bar to escalate: a user following the guide today will hit
              something wrong, missing, or surprising.
            - Dependency bumps are always (D) unless they change public behavior.
            - New components / props not mentioned in any current guide are (D).
              We do not document net-new features in this pass.

            # Step 5 — Compose and post the comment
            Post ONE comment via `gh pr comment $PR_NUMBER --body-file <path>` with:
              1. A verdict table: | PR | summary | verdict |
              2. For each (A) / (B) / (C → A): a fenced ```diff``` block under a heading
                 naming the file path. Diffs must be valid unified diffs against the
                 current file contents, MDX-valid (frontmatter intact, JSX balanced),
                 and self-contained for the use case (no "see also" links to nonexistent
                 docs, no introducing concepts the user does not need for that flow).
            If every entry is (D), post a short one-line comment instead of a table —
            no need for a giant empty verdict.

            Do NOT include the literal string "@claude" anywhere in your comment —
            it would self-trigger the PR assistant workflow. Reviewers already know
            how to invoke it; no footer is needed.

            # Hard rules
            - No edits, no commits, no file writes.
            - Never propose changes to docs/src/content/docs/api/** (auto-generated by gen:api).
            - Never propose changes outside docs/src/content/docs/guides/** or
              docs/src/content/docs/migration/v1-to-v2.mdx.
            - When in doubt between (C) and (D), choose (D).
            - This is a limited scope, keep the tool usage and number of turns to a minimum.
