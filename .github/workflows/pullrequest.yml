name: Pull Request Checks

on:
  pull_request:

permissions: write-all

jobs:
  proto-gen:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: ${{ !startsWith(github.event.pull_request.title, 'Version Packages') }}
    outputs:
      protos_changed: ${{ steps.check-protos.outputs.protos }}

    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          # Commits and trees only. `fetch-depth: 0` fetches every branch, and gh-pages holds ~26 GiB
          # of built preview sites whose blobs no job here ever reads. Blobs are fetched on demand.
          filter: blob:none

      - name: Check for proto changes
        id: check-protos
        uses: dorny/paths-filter@v3
        with:
          filters: |
            protos:
              - 'protos/**'

      - uses: pnpm/action-setup@v6
        name: Install pnpm 🔧
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Set up wireit caching
        uses: google/wireit@setup-github-actions-caching/v2

      - name: Install dependencies
        run: pnpm install

      - name: Setup Buf
        uses: bufbuild/buf-setup-action@v1
        with:
          version: '1.69.0'
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.23.11
          cache: true

      - name: Install protoc-gen-go and protoc-gen-connect-go
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@latest
          go install connectrpc.com/connect/cmd/protoc-gen-connect-go@latest
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

      - name: Generate protos
        run: pnpm proto

      - name: Check proto formatting
        run: pnpm proto:format-check

      - name: Commit generated Go protos
        if: steps.check-protos.outputs.protos == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add draw/v1/
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Automatically regenerated protobuf code"
            git push
          fi

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: ${{ !startsWith(github.event.pull_request.title, 'Version Packages') }}

    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        name: Install pnpm 🔧
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Set up wireit caching
        uses: google/wireit@setup-github-actions-caching/v2

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.23.11
          cache: true

      - name: Install golangci-lint
        run: |
          curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/v2.11.4/install.sh | sh -s -- -b $(go env GOPATH)/bin v2.11.4
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: pnpm install

      - name: Lint 💅
        run: pnpm lint

  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: proto-gen
    if: ${{ !startsWith(github.event.pull_request.title, 'Version Packages') }}

    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        name: Install pnpm 🔧
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Set up wireit caching
        uses: google/wireit@setup-github-actions-caching/v2

      - name: Install dependencies
        run: pnpm install

      # src/lib/math/rdk-math is its own module, and its Go tests write the golden JSON the
      # TypeScript suites import. Pinned to what that module declares rather than to whatever
      # Go the runner image happens to ship.
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: src/lib/math/rdk-math/go.mod
          cache-dependency-path: |
            go.sum
            src/lib/math/rdk-math/go.sum

      # Ahead of the TypeScript gate on purpose: the goldens are generated, not committed, so
      # an RDK disagreement has to surface here as a Go failure rather than downstream as an
      # unresolved import.
      - name: Generate RDK goldens
        run: pnpm test:rdk-golden

      # TS protos (src/lib/buf) are restored from the wireit cache primed by the
      # proto-gen job (this job `needs: proto-gen`), so no buf/artifact needed.
      - name: Check
        run: pnpm check

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: proto-gen
    if: ${{ !startsWith(github.event.pull_request.title, 'Version Packages') }}

    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          # See the proto-gen job above: skips gh-pages' preview-site blobs.
          filter: blob:none

      - uses: pnpm/action-setup@v6
        name: Install pnpm 🔧
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Set up wireit caching
        uses: google/wireit@setup-github-actions-caching/v2

      - name: Install dependencies
        run: pnpm install

      - name: Get Playwright version
        id: playwright-version
        run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      # Skipped on cache hit, --with-deps included: ubuntu-latest ships Chrome, so
      # Chromium's shared libraries are already on the image and apt stays untouched.
      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm playwright install chromium --with-deps

      # src/lib/math/rdk-math is its own module, and its Go tests write the golden JSON the
      # TypeScript suites import.
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: src/lib/math/rdk-math/go.mod
          cache-dependency-path: |
            go.sum
            src/lib/math/rdk-math/go.sum

      # Ahead of the TypeScript gate on purpose: the goldens are generated, not committed, so
      # an RDK disagreement has to surface here as a Go failure rather than downstream as an
      # unresolved import.
      - name: Generate RDK goldens
        run: pnpm test:rdk-golden

      # TS protos (src/lib/buf) are restored from the wireit cache primed by the
      # proto-gen job (this job `needs: proto-gen`), so no buf/artifact needed.
      - name: Test
        run: pnpm test:coverage

      - name: Upload results to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

  test-draw:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: proto-gen
    if: ${{ !startsWith(github.event.pull_request.title, 'Version Packages') }}

    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.23.11
          cache: true

      # draw/v1 (generated Go protos) is committed, so it's already in the
      # checkout — no artifact download needed.
      - name: Test Draw
        run: go test ./draw/... -count=1
