name: Tauri check

# Builds the desktop app in debug on macOS so a Rust or Tauri config break fails the PR. The
# release matrix lives in tauri-release.yml and runs only on a release.

on:
  pull_request:
    paths:
      - 'src-tauri/**'
      - 'cmd/**'
      - 'client/**'
      - 'draw/**'
      - 'motionplan/**'
      - 'mutils/**'
      - 'go.mod'
      - 'go.sum'
      - 'scripts/build-sidecar.mjs'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/tauri-check.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 45
    if: ${{ !startsWith(github.event.pull_request.title, 'Version Packages') }}

    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Set up wireit caching
        uses: google/wireit@setup-github-actions-caching/v2

      - name: Install buf
        uses: bufbuild/buf-setup-action@v1
        with:
          version: '1.69.0'
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install nlopt
        run: brew install nlopt pkg-config

      - name: Install dependencies
        run: pnpm install

      # tauri-build in clippy and cargo test needs src-tauri/binaries/draw-server-<triple>.
      - name: Build sidecar
        run: pnpm build:sidecar

      - name: Rust format and lint
        working-directory: src-tauri
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test

      - name: Build debug app bundle
        run: pnpm tauri build --debug --bundles app
