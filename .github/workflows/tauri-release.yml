name: Tauri release

# Builds the desktop app for every platform and attaches the bundles to an existing
# `v<version>` GitHub release. main.yml calls it after changesets publishes; the dispatch
# form rebuilds the assets for a tag without a new npm publish.
#
# Asset names follow one pattern the Viam CLI derives from (version, GOOS, GOARCH):
#   viam-visualizer-<version>-<platform>-<arch><suffix>
#   platform: darwin | linux | windows      arch: aarch64 | x86_64
#   suffix:   .dmg, .app.tar.gz (darwin), .AppImage, .deb (linux), .exe, -setup.exe (windows)
# plus checksums.txt with one `sha256  name` line per asset.

on:
  workflow_call:
    inputs:
      version:
        description: Version of @viamrobotics/visualization whose release gets the bundles (e.g. 1.2.3)
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to attach bundles to (e.g. v1.2.3)
        required: true
        type: string

permissions:
  contents: write

env:
  TAG: ${{ inputs.tag || format('v{0}', inputs.version) }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            target: aarch64-apple-darwin
            platform: darwin
            arch: aarch64
            bundles: app,dmg
            # One leg uploads the Sentry source maps for this release; the rest only delete theirs.
            sentry: true
          - runner: macos-latest
            target: x86_64-apple-darwin
            platform: darwin
            arch: x86_64
            bundles: app,dmg
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            platform: linux
            arch: x86_64
            bundles: appimage,deb
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            platform: windows
            arch: x86_64
            bundles: nsis
            plain-binary: true

    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60

    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v6
        with:
          ref: ${{ env.TAG }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Set up wireit caching
        uses: google/wireit@setup-github-actions-caching/v2

      - name: Install buf
        uses: bufbuild/buf-setup-action@v1
        with:
          version: '1.69.0'
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf xdg-utils libnlopt-dev pkg-config

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install nlopt (macOS)
        if: runner.os == 'macOS'
        run: brew install nlopt pkg-config

      # Homebrew's nlopt is arm64 on the macos-latest runner, so the x86_64 leg builds a static
      # x86_64 copy from source and points the sidecar script at it.
      - name: Build nlopt for x86_64 (macOS)
        if: matrix.target == 'x86_64-apple-darwin'
        run: |
          set -euo pipefail
          git clone --depth 1 --branch v2.10.0 https://github.com/stevengj/nlopt "$RUNNER_TEMP/nlopt-src"
          cd "$RUNNER_TEMP/nlopt-src"
          cmake -S . -B build \
            -DCMAKE_OSX_ARCHITECTURES=x86_64 \
            -DBUILD_SHARED_LIBS=OFF \
            -DNLOPT_PYTHON=OFF -DNLOPT_OCTAVE=OFF -DNLOPT_MATLAB=OFF -DNLOPT_GUILE=OFF \
            -DNLOPT_SWIG=OFF -DNLOPT_TESTS=OFF \
            -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/nlopt-x86_64"
          cmake --build build
          cmake --install build
          echo "NLOPT_LIBDIR=$RUNNER_TEMP/nlopt-x86_64/lib" >> "$GITHUB_ENV"
          echo "NLOPT_INCLUDEDIR=$RUNNER_TEMP/nlopt-x86_64/include" >> "$GITHUB_ENV"

      # cgo needs a gcc on Windows, and MSYS2 supplies both it and nlopt. The static link recipe
      # is unverified on this leg.
      - name: Install MinGW toolchain and nlopt (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-nlopt
            mingw-w64-x86_64-pkg-config

      - name: Put MinGW on PATH (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          echo "C:\\msys64\\mingw64\\bin" >> "$GITHUB_PATH"
          echo "NLOPT_LIBDIR=C:/msys64/mingw64/lib" >> "$GITHUB_ENV"
          echo "NLOPT_INCLUDEDIR=C:/msys64/mingw64/include" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: pnpm install

      # Build only. With no tagName, tauri-action uploads nothing, because its [arch] rewrites the
      # triple per platform (x64 on macOS and Windows, amd64 on Linux). The next step names assets.
      # tauri build runs `pnpm vite-build` and the sidecar build itself through beforeBuildCommand,
      # so src-tauri/binaries/draw-server-<triple> exists before the bundle step.
      - name: Build bundles
        id: tauri
        uses: tauri-apps/tauri-action@v0
        env:
          SENTRY_AUTH_TOKEN: ${{ matrix.sentry && secrets.SENTRY_AUTH_TOKEN || '' }}
          TAURI_ENV_TARGET_TRIPLE: ${{ matrix.target }}
          CGO_ENABLED: 1
          # The Windows leg falls back to the stub motion planner if nlopt cannot be linked.
          # GOFLAGS: -tags=nomotionplan
        with:
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
          uploadPlainBinary: ${{ matrix.plain-binary || false }}

      - name: Name bundles for the release
        shell: node {0}
        env:
          ARTIFACT_PATHS: ${{ steps.tauri.outputs.artifactPaths }}
          VERSION: ${{ steps.tauri.outputs.appVersion }}
          PLATFORM: ${{ matrix.platform }}
          ARCH: ${{ matrix.arch }}
        run: |
          const fs = require('node:fs')
          const { ARTIFACT_PATHS, VERSION, PLATFORM, ARCH } = process.env
          // Longest first, so a setup installer is not taken for a plain .exe.
          const SUFFIXES = ['.app.tar.gz', '-setup.exe', '.exe', '.dmg', '.AppImage', '.deb']
          const names = new Set()
          fs.mkdirSync('release-assets')
          for (const artifact of JSON.parse(ARTIFACT_PATHS)) {
            // tauri-action reports the .app directory, then tars it beside itself.
            const file = artifact.endsWith('.app') ? `${artifact}.tar.gz` : artifact
            const suffix = SUFFIXES.find((candidate) => file.endsWith(candidate))
            if (!suffix) continue
            const name = `viam-visualizer-${VERSION}-${PLATFORM}-${ARCH}${suffix}`
            if (names.has(name)) throw new Error(`Two artifacts map to ${name}`)
            names.add(name)
            fs.copyFileSync(file, `release-assets/${name}`)
            console.log(`${file} -> ${name}`)
          }
          if (names.size === 0) throw new Error('No release artifacts found')

      - name: Upload bundles
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$TAG" release-assets/* --clobber

  checksums:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Write checksums.txt
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir assets && cd assets
          gh release download "$TAG" --pattern 'viam-visualizer-*'
          sha256sum viam-visualizer-* > ../checksums.txt
          cd ..
          cat checksums.txt
          gh release upload "$TAG" checksums.txt --clobber
