name: Main

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  deploy-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
      actions: write
    outputs:
      published: ${{ steps.changesets.outputs.published }}
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.CI_GITHUB_APP_ID }}
          private-key: ${{ secrets.CI_GITHUB_APP_PRIVATE_KEY }}

      - name: Checkout 🛎️
        uses: actions/checkout@v6
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      - name: Set up wireit caching
        uses: google/wireit@setup-github-actions-caching/v2

      - name: Install buf
        uses: bufbuild/buf-setup-action@v1
        with:
          version: '1.69.0'
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install and Build 🔧
        run: |
          pnpm i
          pnpm proto:gen-ts
          pnpm build

      - name: Create Release Pull Request or Publish to npm
        id: changesets
        uses: changesets/action@v1
        with:
          publish: npm run release
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}

      - name: Extract version from package.json
        id: version
        if: steps.changesets.outputs.published == 'true'
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Published version: $VERSION"

  desktop-release:
    needs: deploy-and-publish
    if: needs.deploy-and-publish.outputs.published == 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/electron-release.yml
    with:
      version: ${{ needs.deploy-and-publish.outputs.version }}
    secrets: inherit

  bump-app-catalog:
    needs: deploy-and-publish
    if: needs.deploy-and-publish.outputs.published == 'true'
    permissions:
      contents: read
      issues: write
    uses: ./.github/workflows/bump-app-catalog.yml
    with:
      version: ${{ needs.deploy-and-publish.outputs.version }}
    secrets: inherit
