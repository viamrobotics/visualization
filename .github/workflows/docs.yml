name: Deploy Docs

on:
  push:
    branches: [main]
  # Allow manual redeploys (e.g. after tweaking workflow itself).
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: docs-deploy
  cancel-in-progress: false

jobs:
  build-app:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.18.0
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup buf
        uses: bufbuild/buf-setup-action@v1
        with:
          version: '1.69.0'
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install protoc-gen-go and protoc-gen-connect-go
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@latest
          go install connectrpc.com/connect/cmd/protoc-gen-connect-go@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Set up wireit caching
        uses: google/wireit@setup-github-actions-caching/v2

      - name: Install root deps
        run: pnpm install

      # proto:gen-ts depends on proto:vendor, so vendoring runs (and is cached)
      # automatically. deploy-docs restores that vendor cache for proto:gen-go.
      - name: Generate protobufs
        run: pnpm proto:gen-ts

      - name: Build root app
        env:
          BASE_PATH: /visualization/playground
          # The deployed playground reports to Sentry (hooks.client.ts). Without this the maps are
          # never uploaded and every stack trace stays minified. PR previews get no token on purpose.
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: pnpm build

      - name: Upload app build
        uses: actions/upload-artifact@v4
        with:
          name: app-build
          path: |
            build/
            !build/models

  deploy-docs:
    runs-on: ubuntu-latest
    needs: build-app

    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.18.0
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup buf
        uses: bufbuild/buf-setup-action@v1
        with:
          version: '1.69.0'
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install protoc-gen-go, protoc-gen-connect-go, and gomarkdoc
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@latest
          go install connectrpc.com/connect/cmd/protoc-gen-connect-go@latest
          go install github.com/princjef/gomarkdoc/cmd/gomarkdoc@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Set up wireit caching
        uses: google/wireit@setup-github-actions-caching/v2

      - name: Install root deps
        run: pnpm install

      # proto:gen-go depends on proto:vendor; the vendor output is restored from
      # the cache primed by build-app (this job `needs: build-app`).
      - name: Generate Go protobufs
        run: pnpm proto:gen-go

      - name: Install docs deps
        working-directory: docs
        run: pnpm install

      - name: Download app build
        uses: actions/download-artifact@v4
        with:
          name: app-build
          path: docs/public/playground/

      - name: Build docs site
        working-directory: docs
        env:
          DOCS_BASE: /visualization/
          DOCS_SITE: https://viamrobotics.github.io
        run: pnpm build

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: docs/dist
          branch: gh-pages
          # `_app/immutable` names each chunk by content hash, so a merging deploy supersedes
          # nothing and accumulates every build's chunks forever.
          clean: true
          # The one tree this job does not own: pr-preview.yml deploys into it from other workflows.
          clean-exclude: pr-preview/**
          git-config-name: github-actions[bot]
          git-config-email: github-actions[bot]@users.noreply.github.com
          commit-message: 'docs: deploy ${{ github.sha }}'
