[package]
name = "viam-visualizer"
version = "0.1.0"
description = "Viam Visualizer desktop app"
authors = ["Viam Inc."]
license = "Apache-2.0"
repository = "https://github.com/viamrobotics/visualization"
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "viam_visualizer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.3", features = [] }
tauri-plugin-log = "2"
tauri-plugin-single-instance = "2.5.3"
